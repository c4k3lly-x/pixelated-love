<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
        }

        .box {
            background: rgba(0, 0, 0, 0.95);
            border: 5px solid #ff1493;
            padding: 50px 70px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255, 20, 147, 0.6);
            text-align: center;
        }

        #text {
            font-size: 64px;
            color: #ff1493;
            letter-spacing: 6px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 400px;
        }

        .blink {
            display: inline-block;
            width: 6px;
            height: 64px;
            background: #ff1493;
            margin-left: 10px;
            animation: blink-animation 0.6s infinite;
        }

        @keyframes blink-animation {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="box">
        <div id="text"></div>
    </div>

    <script>
        const phrase = "I love you";
        const textDiv = document.getElementById('text');
        let index = 0;

        function type() {
            if (index < phrase.length) {
                const char = phrase.charAt(index);
                textDiv.innerHTML += char === ' ' ? '&nbsp;' : char;
                index++;
                setTimeout(type, 300);
            } else {
                textDiv.innerHTML += '<span class="blink"></span>';
            }
        }

        type();
    </script>
</body>
</html>
