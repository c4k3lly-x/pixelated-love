<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You - Pixelated Typing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Press Start 2P', monospace;
        }
        
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 60px 80px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(255, 20, 147, 0.5);
            border: 4px solid #ff1493;
        }
        
        #typeText {
            font-size: 72px;
            color: #ff1493;
            font-family: 'Press Start 2P', monospace;
            font-weight: bold;
            letter-spacing: 8px;
            min-height: 100px;
            display: inline-block;
            line-height: 1.2;
        }
        
        .cursor {
            display: inline-block;
            width: 8px;
            height: 72px;
            background: #ff1493;
            margin-left: 12px;
            vertical-align: text-bottom;
            animation: blink 0.7s step-end infinite;
        }
        
        .cursor.hide {
            display: none;
        }
        
        @keyframes blink {
            0%, 50% {
                opacity: 1;
            }
            51%, 100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <span id="typeText"></span><span class="cursor" id="cursor"></span>
        </div>
    </div>

    <script>
        const fullText = "I love you";
        const typeTextElement = document.getElementById('typeText');
        const cursorElement = document.getElementById('cursor');
        let currentIndex = 0;
        const typingSpeed = 250; // milliseconds per character

        function startTyping() {
            if (currentIndex < fullText.length) {
                typeTextElement.textContent += fullText[currentIndex];
                currentIndex++;
                setTimeout(startTyping, typingSpeed);
            } else {
                // Typing complete - hide cursor
                cursorElement.classList.add('hide');
            }
        }

        // Begin typing after page loads
        window.addEventListener('load', function() {
            setTimeout(startTyping, 300);
        });

        // Backup: start typing immediately if load event already fired
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(startTyping, 300);
        }
    </script>
</body>
</html>
